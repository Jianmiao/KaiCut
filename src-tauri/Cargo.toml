[package]
name = "kaicut"
version = "0.1.0"
description = "KaiCut / 开剪 desktop video editor shell"
authors = ["KaiCut contributors"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kaicut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "=0.8.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["UI_ViewManagement", "Win32_Graphics_Dwm"] }
windows-version = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
