name: KaiCut checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Install JavaScript dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint
      run: pnpm lint
    - name: Frontend tests
      run: pnpm test
    - name: Frontend build
      run: pnpm build
    - name: Rust format check
      run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
    - name: Rust tests
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml
    - name: Native preview Rust tests
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-preview-host
